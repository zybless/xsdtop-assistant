interface:
  display_name: "xsdtop 题库操作"
  short_description: "查询、整理并安全录入 xsdtop 数学或物理题目"
  default_prompt: "Use $xsd-question-bank to organize and validate this paper before importing it into xsdtop."
dependencies:
  tools:
    - type: "mcp"
      value: "xsdtop"
      description: "xsdtop 题库查询、图片上传和题目录入工具"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
