interface:
  display_name: "xsdtop 题库操作"
  short_description: "查询、管理并安全录入 xsdtop 物理、数学或化学题目"
  default_prompt: "Use $xsd-question-bank to organize and validate this paper before importing it into xsdtop."
dependencies:
  tools:
    - type: "mcp"
      value: "xsdtop"
      description: "xsdtop 题库查询、管理、图片上传和题目录入工具"
      transport: "stdio"
    - type: "mcp"
      value: "mineru"
      description: "连接 MinerU 远程服务；本地文件通过官方网页上传并填写个人 Token，禁止使用免密快速模式"
      transport: "streamable_http"
      url: "https://mcp.mineru.net/mcp"
policy:
  allow_implicit_invocation: true
