interface:
  display_name: "xsdtop 题库操作"
  short_description: "查询、管理并安全录入 xsdtop 物理、数学或化学题目"
  default_prompt: "Use $xsd-question-bank to organize and validate this paper before importing it into xsdtop."
dependencies:
  tools:
    - type: "mcp"
      value: "xsdtop"
      description: "xsdtop 题库查询、管理、图片上传、题目录入，以及用老师的 MinerU 密钥在本机直接精准解析 PDF、Word、PPT 和图片"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
